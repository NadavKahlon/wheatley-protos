[project]
name = "aperture-protos"
version = "0.1.0"
description = "Protobufs for Aperture Command & Control"
dependencies = ["protobuf"]

[build-system]
requires = ["hatchling", "hatch-protobuf"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.protobuf]
source_dir = "."
proto_paths = ["."]
